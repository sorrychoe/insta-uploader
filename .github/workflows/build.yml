name: Build Windows exe

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name InstaUploader --hidden-import keyring.backends.Windows --collect-data PySide6 main.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: InstaUploader-Windows-x64
          path: dist/InstaUploader.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dist/InstaUploader.exe
          --target "$GITHUB_SHA"
          --title "Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          --notes "Windows x64 executable built from commit ${GITHUB_SHA}."
